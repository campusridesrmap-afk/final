<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/cr.jpeg" />
  <link rel="apple-touch-icon" href="/cr.jpeg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CampusRide — SRM University-AP Student Carpooling</title>
  <meta name="description"
    content="Verified student carpooling and ridesharing platform for SRM University-AP. Multi-stop routes, direct WhatsApp contact sharing, and fair cost splitting." />
  <meta name="google-site-verification" content="ia9CSMMd57ONqPUBsivNFuIzHwjabt3WrXnE5lkQ2p4" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CampusRide" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    (function () {
      try {
        var preference = localStorage.getItem("campusride_theme") || "system";
        var isDark =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (isDark) {
          root.classList.add("dark");
          root.classList.remove("light");
          root.setAttribute("data-theme", "dark");
          root.style.colorScheme = "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#0b1120");
        } else {
          root.classList.remove("dark");
          root.classList.add("light");
          root.setAttribute("data-theme", "light");
          root.style.colorScheme = "light";
        }
      } catch (_) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
